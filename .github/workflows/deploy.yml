# Build di GitHub, lalu dorong isi dist/ ke branch `deploy` (satu commit, tanpa riwayat).
# DirectAdmin Git Manager men-deploy branch `deploy` ke public_html lewat webhook.
name: Build dan deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Cek anggaran aset Turun
        run: node scripts/check-turun-aset.mjs --dist

      - name: Dorong dist/ ke branch deploy
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build dari ${GITHUB_SHA::7}: $(git -C .. log -1 --format=%s)"
          git push --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" deploy
